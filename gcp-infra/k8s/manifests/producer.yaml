# StatusBus producer — single replica pinned to the on-demand control-plane
# node (the only node guaranteed to be alive; see ARCHITECTURE-DECISIONS §1.3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statusbus-producer
  namespace: statusbus-workloads
  labels:
    app: statusbus-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statusbus-producer
  template:
    metadata:
      labels:
        app: statusbus-producer
    spec:
      imagePullSecrets:
        - name: gcp-artifact-registry-key
      nodeSelector:
        nodeType: control-plane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: producer
          image: asia-south1-docker.pkg.dev/statusbus-app-1ek8/statusbus/statusbus-producer:latest
          imagePullPolicy: Always
          env:
            - name: API_URL
              value: https://api-statusbus.byaniket.site
            - name: PRODUCER_INTERVAL_SEC
              value: "300"
          envFrom:
            - secretRef:
                name: statusbus-worker-env
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
